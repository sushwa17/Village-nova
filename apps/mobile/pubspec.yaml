name: villagenova
description: "A Personalized Digital Intelligence Layer for Rural Life"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing & Navigation
  go_router: ^14.2.0

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Supabase Client
  supabase_flutter: ^2.5.6

  # Local Storage & Caching
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI & Design System (Google Stitch inspired)
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cached_network_image: ^3.3.1

  # Device Hardware & Media
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
